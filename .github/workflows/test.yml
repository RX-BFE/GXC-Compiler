name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run test suite
        run: make test

      - name: Run lint
        run: make lint
