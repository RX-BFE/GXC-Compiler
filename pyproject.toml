[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gxc-compiler"
version = "0.1.0"
description = "GXC compiler and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "GXC Compiler Maintainers"}
]
keywords = ["compiler", "cli", "gxc"]

[project.scripts]
gxc = "Compiler.main:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["Compiler*"]
