[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gxc-compiler"
version = "0.1.0"
description = "GXC compiler and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "GXC Compiler Maintainers"}
]
keywords = ["compiler", "cli", "gxc"]

[project.scripts]
gxc = "Compiler.main:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["Compiler*"]

[dependency-groups]
dev = [
    "pylint>=4.0.8",
]

[tool.pylint.main]
py-version = "3.10"

[tool.pylint."MESSAGES CONTROL"]
disable = [
  "invalid-name",
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "broad-exception-caught",
  "too-many-public-methods",
  "too-many-return-statements",
  "no-else-return",
  "no-else-continue",
  "line-too-long",
  "unused-import",
  "deprecated-module",
]
